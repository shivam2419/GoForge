<!doctype html>
<html><head><meta charset="utf-8">
<style>
@font-face { font-family: 'Cormorant'; src: url('../../public/fonts/cormorant-600.woff2') format('woff2'); font-weight: 600; }
@font-face { font-family: 'Cormorant'; src: url('../../public/fonts/cormorant-600-italic.woff2') format('woff2'); font-weight: 600; font-style: italic; }
@font-face { font-family: 'Manrope'; src: url('../../public/fonts/manrope.woff2') format('woff2'); font-weight: 200 800; }
* { box-sizing: border-box; margin: 0; }
html, body { width: 1200px; height: 630px; overflow: hidden; }
body { background: #F0ECE3; color: #141C30; font-family: 'Manrope', sans-serif; position: relative; }
.frame { position: absolute; top: 28px; bottom: 28px; left: 28px; right: 388px; border: 1.5px solid rgba(202,164,101,.55); border-radius: 22px; }
.corner { position: absolute; width: 30px; height: 30px; border-color: #CAA465; border-style: solid; }
.c1 { top: 18px; left: 18px; border-width: 3px 0 0 3px; } .c2 { top: 18px; right: 378px; border-width: 3px 3px 0 0; }
.c3 { bottom: 18px; left: 18px; border-width: 0 0 3px 3px; } .c4 { bottom: 18px; right: 378px; border-width: 0 3px 3px 0; }
.navy { position: absolute; right: 0; top: 0; bottom: 0; width: 360px; background: #141C30; }
.rings span { position: absolute; border: 1.5px solid rgba(202,164,101,.35); border-radius: 50%; }
.rings span:nth-child(1) { width: 420px; height: 420px; right: -60px; top: 105px; }
.rings span:nth-child(2) { width: 260px; height: 260px; right: 20px; top: 185px; }
.mark { position: absolute; right: 95px; top: 230px; width: 170px; height: 170px; object-fit: contain; }
.content { position: absolute; left: 76px; top: 70px; width: 700px; }
.brand { display: flex; align-items: center; gap: 12px; font-weight: 700; letter-spacing: .18em; font-size: 17px; text-transform: uppercase; }
.brand img { width: 40px; height: 40px; }
.eyebrow { margin-top: 54px; color: #9a7a40; font-weight: 700; letter-spacing: .2em; font-size: 16px; text-transform: uppercase; }
h1 { font-family: 'Cormorant', serif; font-weight: 600; font-size: 76px; line-height: .98; margin-top: 14px; letter-spacing: -.01em; }
h1 em { color: #a07f45; font-style: italic; display: block; }
.chips { display: flex; gap: 12px; margin-top: 34px; flex-wrap: wrap; }
.chip { border: 1.5px solid rgba(20,28,48,.18); background: #FAF8F3; border-radius: 999px; padding: 11px 20px; font-weight: 700; font-size: 19px; }
.chip.gold { background: #CAA465; border-color: #CAA465; color: #141C30; }
.foot { position: absolute; left: 76px; bottom: 62px; font-size: 17px; color: rgba(20,28,48,.7); font-weight: 600; }
</style></head>
<body>
<div class="frame"></div><i class="corner c1"></i><i class="corner c2"></i><i class="corner c3"></i><i class="corner c4"></i>
<div class="navy"><div class="rings"><span></span><span></span></div><img class="mark" src="../../public/img/gf-logo-256.png" alt=""></div>
<div class="content">
  <div class="brand"><img src="../../public/img/gf-logo-128.png" alt="">Goforge Digital</div>
  <p class="eyebrow" id="eb"></p>
  <h1 id="h1"></h1>
  <div class="chips" id="chips"></div>
</div>
<p class="foot" id="foot"></p>
<script>
const d = JSON.parse(decodeURIComponent(location.hash.slice(1)));
document.getElementById('eb').textContent = d.eyebrow;
const h = document.getElementById('h1'); h.textContent = d.title; if (d.em) { const e = document.createElement('em'); e.textContent = d.em; h.appendChild(e); }
d.chips.forEach((c, i) => { const s = document.createElement('span'); s.className = 'chip' + (i === 0 && d.goldFirst ? ' gold' : ''); s.textContent = c; document.getElementById('chips').appendChild(s); });
document.getElementById('foot').textContent = d.foot;
</script>
</body></html>
